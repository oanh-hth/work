<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Threadwork</title>
<meta name="description" content="A todo list that remembers what you learned: results and decisions, filed by web development topic.">
<meta name="theme-color" content="#2F45C2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Threadwork">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section id="login" hidden>
  <div class="login-card">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="8" cy="9" r="4" fill="var(--accent)"/><circle cx="24" cy="10" r="4" fill="var(--gold)"/><circle cx="15" cy="24" r="4" fill="var(--good)"/><path d="M8 9C16 6 18 16 24 10M8 9c0 8 3 13 7 15M24 10c0 7-4 12-9 14" stroke="var(--ink)" stroke-width="1.6" fill="none"/></svg><span>Threadwork</span></div>
    <div id="auth-body" class="stack" style="gap:18px"></div>
  </div>
</section>

<div id="backdrop" aria-hidden="true"></div>
<div id="app" hidden>
  <header class="top">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="8" cy="9" r="4" fill="var(--accent)"/><circle cx="24" cy="10" r="4" fill="var(--gold)"/><circle cx="15" cy="24" r="4" fill="var(--good)"/><path d="M8 9C16 6 18 16 24 10M8 9c0 8 3 13 7 15M24 10c0 7-4 12-9 14" stroke="var(--ink)" stroke-width="1.6" fill="none"/></svg><span>Threadwork</span></div>
    <nav class="tabs" aria-label="Main">
      <a href="#tasks">Tasks</a>
      <a href="#decisions">Decisions</a>
      <a href="#settings">Settings</a>
    </nav>
    <span class="sync" id="sync-top"></span>
    <label class="backdrop-pick"><span class="visually-hidden">Background</span>
      <select id="backdrop-pick" aria-label="Background">
        <option value="coffee">☕ Coffee shop</option><option value="cozy">🛋️ Cozy room</option><option value="library">📚 Library</option>
        <option value="rainy">🌧️ Rainy window</option><option value="city">🌃 Night city</option><option value="plain">Plain</option>
      </select></label>
  </header>
  <button class="board" id="board" type="button" data-act="open-panel" hidden><span class="board-body" id="board-body"></span></button>
  <div class="panel-wrap"><button class="back-to-room" type="button" data-act="close-panel">← Back to the room</button>
  <main class="view" id="view"></main></div>
</div>

<div class="overlay" id="outcome" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="dialog card" id="dialog" hidden role="dialog" aria-modal="true"></div>
<div id="toast" hidden role="status"></div>

<script>
// Safety net: if the app fails to start, show a message instead of an empty background.
(function(){
  function show(msg){
    if(document.getElementById("start-error")) return;
    var d=document.createElement("div"); d.id="start-error"; d.setAttribute("role","alert");
    d.style.cssText="position:fixed;inset:auto 16px 16px;z-index:99;max-width:520px;margin:0 auto;padding:16px;border-radius:12px;background:#fff;color:#1D2227;box-shadow:0 10px 30px rgba(0,0,0,.3);font:16px/1.4 system-ui,sans-serif";
    d.innerHTML="<b>Threadwork couldn't start.</b><br>An update may still be loading. <button type='button' style='margin-top:10px;display:block;padding:10px 16px;border-radius:999px;border:0;background:#2B3FC2;color:#fff;font:inherit'>Reload</button><small style='display:block;margin-top:8px;color:#646B72'></small>";
    d.querySelector("small").textContent=msg||"";
    d.querySelector("button").onclick=function(){ location.reload(); };
    document.body.appendChild(d);
  }
  window.addEventListener("error",function(e){ show(e.message); });
  window.addEventListener("unhandledrejection",function(e){ show(e.reason&&e.reason.message); });
  // If nothing is showing a few seconds after load, offer the reload anyway.
  window.addEventListener("load",function(){ setTimeout(function(){
    var app=document.getElementById("app"), login=document.getElementById("login");
    if(app&&app.hidden&&(!login||login.hidden)) show("");
  },4000); });
})();
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
